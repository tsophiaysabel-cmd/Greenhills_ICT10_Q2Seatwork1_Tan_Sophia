<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South American Nicknames</title>

    <!-- Google Fonts: Syne for modern headers & DM Sans for clean body text -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- PyScript Files -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        :root {
            --bg-color: #FFF8F0;
            --primary: #E05A47;       /* Vibrant Terracotta/Coral */
            --secondary: #2D6A4F;     /* Deep Botanical Green */
            --accent: #F4A261;        /* Warm Sun Gold */
            --card-bg: #FFFFFF;
            --text-dark: #1D2D24;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Decorative vibrant blob shapes in the background */
        .blob-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: rgba(244, 162, 97, 0.2);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
        }

        .blob-2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: rgba(45, 106, 79, 0.15);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(29, 45, 36, 0.08);
            border: 2px solid rgba(224, 90, 71, 0.1);
        }

        .badge {
            display: inline-block;
            background-color: rgba(224, 90, 71, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.15;
            margin-bottom: 0.75rem;
        }

        p.subtitle {
            font-size: 0.95srem;
            color: #65776d;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 1rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-dark);
            background-color: #F8F9FA;
            border: 2px solid #E5E9E6;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
            background-color: #FFF;
            box-shadow: 0 0 0 4px rgba(224, 90, 71, 0.12);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(224, 90, 71, 0.3);
        }

        button:hover {
            background-color: #cf4b38;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(224, 90, 71, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #F0F7F4;
            border-left: 4px solid var(--secondary);
            border-radius: 0 12px 12px 0;
            font-size: 1rem;
            font-weight: 500;
            color: var(--secondary);
            min-height: 1.5rem;
            text-align: left;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #889890;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Background decorative blur elements -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="container">
        <div class="badge">South America</div>
        <h1>Country Nickname Explorer</h1>
        <p class="subtitle">Choose a nation from the list below to discover its legendary title.</p>

        <div class="input-group">
            <label for="country">Select Country</label>
            <select id="country">
                <option value="Argentina">Argentina</option>
                <option value="Bolivia">Bolivia</option>
                <option value="Brazil">Brazil</option>
                <option value="Chile">Chile</option>
                <option value="Colombia">Colombia</option>
                <option value="Ecuador">Ecuador</option>
                <option value="Guyana">Guyana</option>
                <option value="Paraguay">Paraguay</option>
                <option value="Peru">Peru</option>
            </select>
        </div>

        <button py-click="show_name">Show Nickname</button>

        <p id="result"></p>
    </div>

    <footer>
        PyScript Interactive App &bull; South America Edition
    </footer>

    <!-- PyScript execution script link -->
    <script type="py" src="main.py"></script>

</body>
</html>
